services:
  # One-shot CLI usage:
  #   docker compose run --rm cli interview.mp4 -f srt
  cli:
    build: .
    image: video-transcriber:latest
    volumes:
      - ./data:/data          # put your media files here
      - ./output:/output      # transcripts land here
    working_dir: /data
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    # override the command at runtime

  # Persistent web UI:
  #   docker compose up web
  #   open http://localhost:7860
  web:
    build: .
    image: video-transcriber:latest
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
      - ./output:/output
      - huggingface_cache:/home/appuser/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command: ["web", "--host", "0.0.0.0", "--port", "7860"]
    restart: unless-stopped

volumes:
  huggingface_cache:
