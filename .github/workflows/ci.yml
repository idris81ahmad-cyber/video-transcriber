name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ --select E,F
          ruff check tests/
          ruff format --check tests/

      - name: Run unit tests
        run: |
          pytest --cov=video_transcriber --cov-report=term-missing

      - name: Verify CLI entry points
        run: |
          video-transcriber --version
          video-transcriber models
          video-transcriber doctor || true
