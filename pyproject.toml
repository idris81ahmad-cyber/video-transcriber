[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "video-transcriber"
version = "1.3.0"
description = "Fast, accurate, fully local video & audio transcription powered by Faster-Whisper"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "idris81ahmad-cyber", email = "idris81ahmad@gmail.com" }
]
maintainers = [
    { name = "idris81ahmad-cyber", email = "idris81ahmad@gmail.com" }
]
keywords = [
    "whisper",
    "transcription",
    "speech-to-text",
    "faster-whisper",
    "video",
    "audio",
    "subtitle",
    "srt",
    "vtt",
    "cli",
    "youtube",
    "diarization",
    "speaker",
    "local",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "faster-whisper>=1.0.3",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
url = ["yt-dlp>=2024.1.0"]
diarization = [
    "pyannote.audio>=3.1.0",
    "torch",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
video-transcriber = "video_transcriber.cli:run"
transcribe = "video_transcriber.cli:run"

[project.urls]
Homepage = "https://github.com/idris81ahmad-cyber/video-transcriber"
Repository = "https://github.com/idris81ahmad-cyber/video-transcriber"
Issues = "https://github.com/idris81ahmad-cyber/video-transcriber/issues"
Changelog = "https://github.com/idris81ahmad-cyber/video-transcriber/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/video_transcriber",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_transcriber"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
